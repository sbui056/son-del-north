<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed</title>
<style>
  :root { --bg: #f4f2ee; --card: #fff; --ink: #1c1b19; --muted: #77736b; --line: #e3dfd7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px 16px; font-weight: 700; text-align: center; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 80px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 14px 0; }
  .who { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .dot { width: 32px; height: 32px; border-radius: 50%; }
  .name { font-weight: 600; }
  .time { color: var(--muted); font-size: 13px; }
  figure { margin: 10px 0 0; }
  figure img { width: 100%; border-radius: 10px; display: block; }
</style>
</head>
<body>
<header>Feed</header>
<main id="feed"></main>
<script>
const names = ["maya_r", "dtran", "jules", "sam.k", "nora", "big_ben_22", "lin", "osc4r", "pri", "the_real_tom"];
fetch("feed/feed.json").then((r) => r.json()).then((posts) => {
  const feed = document.getElementById("feed");
  posts.forEach((p, i) => {
    const a = document.createElement("article");
    const hue = (i * 47) % 360;
    a.innerHTML = `<div class="who"><div class="dot" style="background:hsl(${hue} 45% 70%)"></div>
      <div><div class="name"></div><div class="time">${(i % 9) + 1}h</div></div></div>
      <div class="text"></div><figure><img loading="lazy" alt=""></figure>`;
    a.querySelector(".name").textContent = names[i % names.length];
    a.querySelector(".text").textContent = p.caption;
    a.querySelector("img").src = "feed/" + p.img;
    feed.append(a);
  });
});
</script>
</body>
</html>
