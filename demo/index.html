<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --ink: #14161a; --muted: #6b717c; --line: #e6e8ec; --accent: #3b5bdb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 580px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
  .logo i { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--accent); display: block; }
  .tabs { display: flex; gap: 4px; margin-left: auto; font-size: 14px; }
  .tabs span { padding: 5px 12px; border-radius: 999px; color: var(--muted); }
  .tabs .on { background: var(--ink); color: #fff; font-weight: 600; }
  main { max-width: 580px; margin: 0 auto; padding: 8px 16px 80px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; box-shadow: 0 1px 2px rgba(20,22,26,.04); }
  .who { display: flex; gap: 10px; align-items: center; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; flex: none; }
  .name { font-weight: 650; }
  .meta { color: var(--muted); font-size: 13.5px; }
  .more { margin-left: auto; color: var(--muted); letter-spacing: 2px; font-weight: 700; }
  .text { margin: 10px 0 0; }
  figure { margin: 12px 0 0; }
  figure img { width: 100%; border-radius: 12px; display: block; background: var(--line); }
  .acts { display: flex; gap: 22px; margin-top: 10px; color: var(--muted); font-size: 13.5px; }
  .acts span { display: flex; align-items: center; gap: 6px; }
  .acts svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .acts .share { margin-left: auto; }
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><i></i>Loop</div>
  <div class="tabs"><span class="on">For you</span><span>Following</span><span>Local</span></div>
</div></header>
<main id="feed"></main>
<script>
const people = [["Maya Reyes", "maya_r"], ["David Tran", "dtran"], ["Jules", "jules.irl"], ["Sam Kim", "sam.k"], ["Nora B", "nora"],
  ["Ben", "big_ben_22"], ["Lin Zhou", "linz"], ["Oscar", "osc4r"], ["Priya S", "pri"], ["Tom", "the_real_tom"]];
const icons = {
  like: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  reply: '<path d="M4 5h16v11H9l-5 4z"/>',
  repost: '<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
  share: '<path d="M12 4v11M8 8l4-4 4 4M5 14v5h14v-5"/>'
};
const icon = (k) => `<svg viewBox="0 0 24 24">${icons[k]}</svg>`;
const num = (n) => n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "k" : String(n);
fetch("feed/feed.json").then((r) => r.json()).then((posts) => {
  const feed = document.getElementById("feed");
  posts.forEach((p, i) => {
    const [name, handle] = people[i % people.length];
    const hue = (i * 47) % 360;
    const likes = ((i * 7919) % 4800) + 40;
    const a = document.createElement("article");
    a.innerHTML = `<div class="who"><div class="av" style="background:hsl(${hue} 42% 58%)"></div>
      <div><div class="name"></div><div class="meta"></div></div><div class="more">...</div></div>
      <div class="text"></div><figure><img loading="lazy" alt=""></figure>
      <div class="acts"><span>${icon("like")}${num(likes)}</span><span>${icon("reply")}${num(Math.round(likes / 9))}</span>
      <span>${icon("repost")}${num(Math.round(likes / 5))}</span><span class="share">${icon("share")}</span></div>`;
    a.querySelector(".av").textContent = name[0];
    a.querySelector(".name").textContent = name;
    a.querySelector(".meta").textContent = `@${handle} · ${(i % 9) + 1}h`;
    a.querySelector(".text").textContent = p.caption;
    a.querySelector("img").src = "feed/" + p.img;
    feed.append(a);
  });
});
</script>
</body>
</html>
